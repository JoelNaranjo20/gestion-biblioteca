{% extends "common/base.html" %}
{% block titulo %}Acceso · Biblioteca Municipal{% endblock %}
{% block contenido %}
  <div class="card" style="max-width:420px;margin:2rem auto">
    <h1>Acceso</h1>
    <form method="post">
      {% csrf_token %}
      {% if form.non_field_errors %}<div class="msg error">{{ form.non_field_errors }}</div>{% endif %}
      <label for="id_username">Usuario o correo</label>
      <input type="text" name="username" id="id_username" autofocus required>
      <label for="id_password">Contraseña</label>
      <input type="password" name="password" id="id_password" required>
      <input type="hidden" name="next" value="{{ next }}">
      <p style="margin-top:1rem"><button class="btn" type="submit">Entrar</button></p>
    </form>
  </div>
{% endblock %}
