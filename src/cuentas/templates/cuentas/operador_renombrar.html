{% extends "common/base.html" %}
{% block titulo %}Renombrar operador{% endblock %}
{% block contenido %}
  <div class="card" style="max-width:420px">
    <h1>Renombrar {{ operador.username }}</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <p>
        <button class="btn" type="submit">Guardar</button>
        <a class="btn secundario" href="{% url 'cuentas:operador_lista' %}">Cancelar</a>
      </p>
    </form>
  </div>
{% endblock %}
