[project]
name = "biblioteca-municipal"
version = "0.1.0"
description = "Catálogo y préstamos de la biblioteca municipal (aplicación de escritorio)"
requires-python = ">=3.12"
dependencies = [
    "django~=5.2",
    "psycopg[binary]~=3.2",
    "django-environ~=0.11",
    "whitenoise~=6.7",
    "waitress~=3.0",
    "pywebview~=5.3",
    "django-crispy-forms~=2.3",
    "crispy-bootstrap5~=2024.10",
    "django-axes~=6.5",
    "argon2-cffi~=23.1",
]

[dependency-groups]
dev = [
    "pytest~=8.3",
    "pytest-django~=4.9",
    "pytest-cov~=5.0",
    "factory-boy~=3.3",
    "ruff~=0.6",
    "mypy~=1.11",
    "django-stubs~=5.1",
    "pre-commit~=3.8",
    "pyinstaller~=6.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "SIM"]
ignore = ["DJ001"]  # permitir null=True en CharField cuando el dominio lo requiere (documento anonimizable)

[tool.ruff.lint.isort]
known-first-party = ["common", "cuentas", "catalogo", "prestamos", "configuracion", "privacidad"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gestion_biblioteca.settings"
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "--reuse-db --strict-markers"
testpaths = ["tests"]
env = ["APP_ENTORNO=test"]

[tool.coverage.run]
source = ["src"]
omit = ["*/migrations/*", "*/tests/*", "desktop/*"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
mypy_path = "src"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "gestion_biblioteca.settings"

[tool.uv]
package = false
