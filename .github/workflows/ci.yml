name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biblioteca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENTORNO: test
      DJANGO_SETTINGS_MODULE: gestion_biblioteca.settings
      DATABASE_TEST_URL: postgres://postgres:postgres@localhost:5432/biblioteca_test
      SECRET_KEY: ci-insecure-key-para-pruebas-solamente

    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Sincronizar dependencias
        run: uv sync --frozen

      - name: Lint (ruff)
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Comprobación de Django
        run: uv run python manage.py check

      - name: Migraciones al día
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Pruebas
        run: uv run pytest -q
